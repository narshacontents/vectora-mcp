name: Verify marketplace contents

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generated plugins match their canonical sources
        run: node scripts/build-marketplace.mjs --check
      - name: Test client launchers and Gemini extension
        run: node --test tests/claude-launcher.test.mjs tests/gemini-extension.test.mjs
      - name: Test marketplace release staging safeguards
        run: node --test tests/stage-release.test.mjs
