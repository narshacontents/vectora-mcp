name: Verify marketplace contents

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The plugins are built in narshacontents/vectora-studio (rust/mcp-plugin, rust/packaging/vectora-mcp-layout.mjs);
      # this checks the published files against vectora-release.json.
      - name: Check the published plugins
        run: node scripts/verify-plugins.mjs
